name: D1 diagnosa (sementara)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Cek status token dan akses D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          echo "=== Token verify ==="
          curl -sS "${AUTH[@]}" "$API/user/tokens/verify" \
            | jq '{success, status: .result.status, messages: [.messages[]?.code]}'

          echo ""
          echo "=== D1 list ==="
          curl -sS "${AUTH[@]}" "$API/accounts/$CF_ACCOUNT_ID/d1/database?name=elcica-auth" \
            | jq '{success, errors: [.errors[]? | {code, message}], count: (.result | length)}'
