<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | ELCICA</title>
    <meta name="theme-color" content="#080d0b">
    <style>
        :root {
            --bg: #080d0b;
            --panel: #0d1511;
            --panel2: #111c16;
            --green: #7cff9b;
            --green2: #22d66b;
            --amber: #d6ad62;
            --text: #e4eee7;
            --muted: #84968a;
            --border: rgba(124,255,155,.16);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(ellipse at 50% -20%, rgba(34,214,107,.10), transparent 55%), var(--bg);
            color: var(--text);
            font-family: "Courier New", monospace;
            line-height: 1.6;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: linear-gradient(145deg, var(--panel2), var(--panel));
            border: 1px solid var(--border);
            padding: 30px;
        }
        .eyebrow { color: var(--amber); font-size: .68rem; letter-spacing: 3px; margin-bottom: 10px; }
        h1 { color: var(--green); font-size: 1.8rem; letter-spacing: 3px; }
        .lead { color: var(--muted); font-size: .76rem; margin: 8px 0 24px; }
        label { display: block; color: var(--muted); font-size: .7rem; margin-bottom: 6px; letter-spacing: 1px; }
        input {
            width: 100%;
            background: #070c09;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: .82rem;
            padding: 11px 12px;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: var(--green2); }
        button {
            width: 100%;
            background: var(--green2);
            color: #07110a;
            border: 0;
            font-family: inherit;
            font-weight: bold;
            font-size: .78rem;
            letter-spacing: 1px;
            padding: 12px;
            cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: wait; }
        .msg { color: var(--amber); font-size: .74rem; min-height: 20px; margin-top: 12px; }
        .ok { color: var(--green); }
        .foot { margin-top: 20px; text-align: center; font-size: .7rem; }
        .foot a { color: var(--muted); }
        .foot a:hover { color: var(--green); }
    </style>
</head>
<body>
    <div class="card">
        <div class="eyebrow">// SESSION LOGIN</div>
        <h1>ELCICA LOGIN</h1>
        <p class="lead">Cookie <code>elcica_session</code> akan dibuat server untuk subdomain <code>.elcica.xyz</code>.</p>

        <form id="form">
            <label for="email">EMAIL</label>
            <input id="email" name="email" type="email" autocomplete="username" required>

            <label for="password">PASSWORD</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="submit" type="submit">MASUK → ADMIN</button>
        </form>

        <div class="msg" id="msg"></div>
        <div class="foot"><a href="/">← KEMBALI KE LANDING</a></div>
    </div>

    <script>
        function el(id) { return document.getElementById(id); }

        el('form').addEventListener('submit', function (event) {
            event.preventDefault();
            var button = el('submit');
            var msg = el('msg');

            button.disabled = true;
            msg.className = 'msg';
            msg.textContent = 'Memeriksa kredensial...';

            fetch('/api/auth/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: el('email').value.trim(),
                    password: el('password').value
                })
            })
            .then(function (r) {
                if (!r.ok) { throw new Error('Login gagal. Periksa email/password atau status verifikasi.'); }
                return r.json();
            })
            .then(function () {
                msg.className = 'msg ok';
                msg.textContent = 'Login berhasil. Mengarahkan ke /admin...';
                window.location.assign('/admin');
            })
            .catch(function (err) {
                msg.textContent = err.message || 'Login gagal.';
                button.disabled = false;
            });
        });
    </script>
</body>
</html>
